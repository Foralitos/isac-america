[project]
name = "isac"
version = "0.1.0"
description = "ISAC 2026 · Hackathon Club América: la historia de un entrenador (Almada) a través de los datos de StatsBomb"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=2",
    "python-dotenv>=1.0",
    "pymongo>=4.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "plotly>=5.24",
]

[project.scripts]
isac = "isac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isac"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
